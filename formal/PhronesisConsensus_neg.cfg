\* NEGATIVE test config for PhronesisConsensus.
\* Threshold = 2 is BELOW the BFT quorum bound 2F+1 = 3 (for N=4, F=1).
\* TLC MUST report an Agreement violation here — this proves the quorum
\* threshold is load-bearing and the safety invariants are not vacuous.
\* (The CI step asserts TLC exits non-zero on this config.)

CONSTANTS
    Agents = {a1, a2, a3, a4}
    Actions = {act1, act2}
    MaxRounds = 1
    Threshold = 2
    Byzantine = {a4}
    NULL = NULL

SPECIFICATION Spec

INVARIANTS
    TypeOK
    Agreement
    Validity
    ByzantineSafety
