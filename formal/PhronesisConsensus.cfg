\* TLC configuration for PhronesisConsensus (Byzantine quorum model).
\* N = 4 agents, F = 1 Byzantine (a4), Threshold = 2F+1 = 3, N >= 3F+1.
\* Run with: tlc PhronesisConsensus.tla -config PhronesisConsensus.cfg

CONSTANTS
    Agents = {a1, a2, a3, a4}
    Actions = {act1, act2}
    MaxRounds = 1
    Threshold = 3
    Byzantine = {a4}
    NULL = NULL

SPECIFICATION Spec

INVARIANTS
    TypeOK
    Agreement
    Validity
    ByzantineSafety
