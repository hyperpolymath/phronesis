#
# k9iser manifest for phronesis
# Practical reasoning and knowledge service

[project]
name = "phronesis"
safety_tier = "yard"

[[source]]
path = "mix.exs"
type = "elixir"
output = "generated/k9iser/elixir-manifest.k9"

[[source]]
path = "Justfile"
type = "justfile"
output = "generated/k9iser/justfile-recipes.k9"

[[source]]
path = "Containerfile"
type = "containerfile"
output = "generated/k9iser/container-build.k9"

[[source]]
path = ".github/workflows/hypatia-scan.yml"
type = "workflow"
output = "generated/k9iser/ci-security.k9"

[[constraint]]
rule = "container.base_image uses chainguard or distroless"
severity = "warn"

[[constraint]]
rule = "workflows includes hypatia-scan"
severity = "error"

[[constraint]]
rule = "services.phronesis.tls is enabled in production"
severity = "warn"
