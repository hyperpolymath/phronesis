# eclexiaiser manifest for phronesis

[project]
name = "phronesis"

[[functions]]
name = "handle_call"
source = "lib/phronesis/consensus/server.ex"
energy-budget-mj = 30.0
carbon-budget-mg = 6.0

[[functions]]
name = "vote"
source = "lib/phronesis/consensus/server.ex"
energy-budget-mj = 25.0
carbon-budget-mg = 5.0

[carbon]
provider = "static"
region = "GB"
static-intensity = 200.0

[report]
format = "text"
include-recommendations = true
